name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find project and build APK
        run: |
          PACKAGE=$(find . -name package.json -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json not found in project root"
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if "ru.maminmir.app" not in packages:
              raise SystemExit("ERROR: google-services.json does not contain Android package ru.maminmir.app")
          print("Firebase Android package verified.")
          PY

          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

          npx cap add android || true
          npx esbuild www/push.js --bundle --format=esm --outfile=www/push.bundle.js
          npx cap sync android

          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          echo "Firebase Android config copied."

          # Configure Google Services so the native app can use Firebase Cloud Messaging.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.exists() or not app.exists():
              raise SystemExit("Android Gradle files were not generated.")
          root_text = root.read_text()
          marker = "com.google.gms:google-services"
          if marker not in root_text:
              if "dependencies {" not in root_text:
                  raise SystemExit("Could not find root Gradle dependencies block.")
              root_text = root_text.replace(
                  "dependencies {",
                  "dependencies {\\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1
              )
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\\n\\napply plugin: 'com.google.gms.google-services'\\n"
              app.write_text(app_text)
          print("Google Services Gradle plugin configured.")
          PY

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mamin-Mir-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
