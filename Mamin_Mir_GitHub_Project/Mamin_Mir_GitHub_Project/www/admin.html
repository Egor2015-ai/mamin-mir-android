<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f5"><title>Админ-панель — Мамин мир</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff6f8,#f5f0ff);font-family:Arial,sans-serif;color:#493b45;padding:22px}.wrap{max-width:760px;margin:auto}.card{background:#ffffffd9;border:1px solid #f0dce6;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 8px 28px #8c587411}h1{color:#a64f79;margin:8px 0}h2{font-size:20px;color:#995477}p,.muted{color:#806d79;line-height:1.5}input,textarea{width:100%;padding:13px;border:1px solid #e5cbd9;border-radius:12px;font:inherit;margin:7px 0 12px;background:white}textarea{min-height:150px;resize:vertical}button,.btn{border:0;border-radius:12px;padding:12px 17px;background:#bd7297;color:white;font-weight:bold;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#eee3eb;color:#69495b}.row{display:flex;gap:10px;flex-wrap:wrap}.entry{border:1px solid #ecd8e2;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.entry p{white-space:pre-wrap}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#f5eaf0;color:#77445e}.danger{background:#b75a67}label{font-size:14px;color:#735d6a}
</style></head><body><main class="wrap"><a class="btn secondary" href="index.html">← Вернуться в приложение</a><h1>🌷 Админ-панель</h1><p>Управление письмами для мамы Оли</p>
<section class="card" id="login"><h2>🔐 Вход администратора</h2><label>Электронная почта</label><input id="email" type="email" autocomplete="username" placeholder="Твоя почта"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Пароль Firebase"><button id="loginBtn">Войти</button><p id="loginMsg" class="muted"></p></section>
<section class="hidden" id="panel"><div class="card"><h2>✍️ Новое письмо</h2><label for="title">Заголовок</label><input id="title" maxlength="80" placeholder="Например, Просто так ❤️"><label for="body">Текст письма</label><textarea id="body" maxlength="5000" placeholder="Напиши тёплые слова для мамы..."></textarea><label for="publishAt">Когда показать письмо (оставь пустым, чтобы показать сразу)</label><input id="publishAt" type="datetime-local"><div class="row"><button id="save">Опубликовать / сохранить</button><button class="secondary" id="clear">Очистить</button><button class="secondary" id="logout">Выйти</button></div><p class="muted">Письма сохраняются в Firebase и появляются на телефоне мамы при подключении к интернету.</p></div><div class="card"><h2>💌 Сохранённые письма</h2><div id="list"></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCArimolQwfSka805dKsT9Nxuo7EW1pDaU",authDomain:"mamin-mir.firebaseapp.com",projectId:"mamin-mir",storageBucket:"mamin-mir.firebasestorage.app",messagingSenderId:"309496375401",appId:"1:309496375401:web:bd9471e1db8f79735d5af8"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const ADMIN_UID="5PntGD5vtMaLGdiI8MLi2WINSug1";const $=id=>document.getElementById(id);let editing=null,unsubscribe=null;
$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){$('loginMsg').textContent='Не удалось войти. Проверь почту и пароль.'}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
auth.onAuthStateChanged(user=>{
 if(unsubscribe){unsubscribe();unsubscribe=null}
 if(user&&user.uid===ADMIN_UID){$('login').classList.add('hidden');$('panel').classList.remove('hidden');unsubscribe=db.collection('letters').onSnapshot(render,error=>{$('list').textContent='Ошибка загрузки писем: '+error.message})}
 else{$('login').classList.remove('hidden');$('panel').classList.add('hidden');if(user)auth.signOut()}
});
function reset(){editing=null;$('title').value='';$('body').value='';$('publishAt').value='';$('save').textContent='Опубликовать письмо'}
$('clear').onclick=reset;$('logout').onclick=()=>auth.signOut();
$('save').onclick=async()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!body){alert('Напиши текст письма.');return}
 const publishAt=$('publishAt').value?new Date($('publishAt').value).toISOString():'';
 const item={title:title||'Письмо для мамы Оли',body,publishAt,createdAt:Date.now()};
 try{if(editing)await db.collection('letters').doc(editing).update(item);else await db.collection('letters').add(item);reset()}catch(e){alert('Не удалось сохранить письмо. Проверь интернет и правила Firestore.')}
};
function render(snapshot){$('list').innerHTML='';if(snapshot.empty){$('list').textContent='Пока писем нет.';return}
 snapshot.docs.forEach(doc=>{const x=doc.data(),d=document.createElement('article');d.className='entry';const h=document.createElement('strong');h.textContent=x.title||'Письмо';const p=document.createElement('p');p.textContent=x.body||'';const info=document.createElement('small');info.textContent=x.publishAt?'Публикация: '+new Date(x.publishAt).toLocaleString('ru-RU'):'Опубликовано сразу';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Изменить';edit.onclick=()=>{editing=doc.id;$('title').value=x.title||'';$('body').value=x.body||'';$('publishAt').value=x.publishAt?new Date(x.publishAt).toISOString().slice(0,16):'';$('save').textContent='Сохранить изменения';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='Удалить';del.style.marginLeft='8px';del.onclick=async()=>{if(confirm('Удалить это письмо?')){try{await db.collection('letters').doc(doc.id).delete()}catch(e){alert('Не удалось удалить письмо.')}}};d.append(h,p,info,document.createElement('br'),edit,del);$('list').append(d)})}
</script></body></html>
